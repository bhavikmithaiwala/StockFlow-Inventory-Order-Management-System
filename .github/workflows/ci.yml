name: StockFlow verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: stockflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27018/stockflow?replicaSet=rs0&directConnection=true
      APP_ORIGIN: http://localhost:4200
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start transaction-capable database
        run: docker compose up -d --wait
      - name: Verify real replica-set commit and rollback
        run: node scripts/check-replica.mjs
      - name: Install browser and video encoder
        run: npx playwright install --with-deps chromium ffmpeg
      - name: Configure Karma browser
        run: |
          chrome_path="$(command -v google-chrome)"
          printf 'CHROME_BIN=%s\n' "$chrome_path" >> "$GITHUB_ENV"
      - name: Workspace and API contract
        run: |
          npm run check:workspace
          node scripts/check-openapi.mjs
      - name: Lint and formatting
        run: |
          npm run lint
          npm run format:check
      - name: Typecheck and production builds
        run: |
          npm run typecheck
          npm run build
      - name: Backend unit, API and transaction races
        run: npm test --workspace @stockflow/api
      - name: Angular browser tests
        run: npm test --workspace @stockflow/client
      - name: Full browser workflow and staff restrictions
        run: npm run test:e2e
      - name: Runtime dependency audit
        run: npm audit --omit=dev
      - name: Compiled full-stack production browser probe
        run: node scripts/check-production.mjs
      - name: Upload actual workflow evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stockflow-browser-evidence
          path: |
            docs/screenshots/
            docs/demo/
            test-results/
            playwright-report/
          retention-days: 14
      - name: Database logs on failure
        if: failure()
        run: docker compose logs mongodb
      - name: Stop CI database
        if: always()
        run: docker compose down
