<a class="skip-link" href="#main-content">Skip to content</a>
<div class="application">
  <aside aria-label="Application sidebar">
    <div class="brand">
      <span aria-hidden="true">SF</span>
      <h1>StockFlow</h1>
    </div>
    <p class="tagline">Inventory &amp; orders</p>
    <nav aria-label="Main navigation">
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Sign in</a>
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >System overview</a
      >
    </nav>
  </aside>
  <div class="workspace">
    <header>
      <span>Single warehouse</span><span>{{ session.user()?.name ?? 'StockFlow workspace' }}</span>
    </header>
    <main id="main-content" tabindex="-1"><router-outlet /></main>
  </div>
</div>
